<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>47th Annual Westmoreland Middle School Soccer Tournament</title>
<style>
:root{--blue:#164d86;--blue2:#0f3762;--ink:#17212b;--muted:#66717d;--line:#dce2e8;--panel:#fff;--bg:#f4f6f8;--soft:#eaf2fa;--green:#287a45;--red:#a73737}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}.shell{max-width:720px;margin:auto;min-height:100vh;padding:14px}.hero{background:var(--blue);color:#fff;border-radius:22px;padding:24px 20px;box-shadow:0 10px 30px rgba(13,44,77,.13)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em}.hero h1{font-size:25px;line-height:1.08;margin:6px 0 8px}.hero p{margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 3px 12px rgba(21,32,43,.04)}
.nav{width:100%;display:flex;align-items:center;text-align:left;gap:14px}.icon{font-size:27px;width:36px}.grow{flex:1}.title{font-size:17px;font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.money{border-left:5px solid var(--green)}.btn{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:11px 15px;font-weight:800;min-height:44px}.btn:disabled{background:#aab4be}.danger{background:#fff0f0;color:var(--red);border:1px solid #efcccc}
.back{background:transparent;border:0;color:var(--blue);font-weight:800;padding:12px 2px}.heading{font-size:23px;font-weight:900;margin:10px 0 4px}.day{font-weight:900;font-size:16px;margin:22px 2px 6px}
.shift{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line)}.shift:first-child{border-top:0}.note{background:var(--soft);border-radius:12px;padding:12px;font-size:13px;line-height:1.45;margin-top:10px}
.progress{height:8px;background:#e7ebef;border-radius:99px;overflow:hidden;margin:10px 0 4px}.progress span{display:block;height:100%;background:var(--blue)}
label{display:block;font-weight:800;font-size:14px;margin:12px 0 5px}input,select{width:100%;border:1px solid #cbd3db;border-radius:11px;padding:12px;background:#fff;font-size:16px}.actions{margin-top:14px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 0 12px}
@media(min-width:600px){.shell{padding:24px}.hero{padding:30px}.hero h1{font-size:31px}}
</style>
</head>
<body>
<div id="app"><main class="shell"><div class="card"><b>Starting tournament site…</b></div></main></div>
<script>
(function(){
"use strict";
var A=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"']/g,function(c){var m={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};return m[c];});}
function fail(e){A.innerHTML='<main class="shell"><div class="card"><div class="title">Tournament startup error</div><div class="sub">'+esc(e&&e.message?e.message:e)+'</div></div></main>';}
try{
var food=[
["Eggs",15,"dozen",""],["Muffins",6,"dozen",""],["Granola Bars",6,"boxes","Please consider gluten-free options."],["Bananas",6,"bunches",""],["Variety Packs of Chips",20,"packs",""],["Chili",4,"crock pots",""],["Full-Sized Candy Bars",10,"boxes",""],["Cookies",8,"dozen",""],["Hot Dog Buns",30,"packages",""]
];
var equipment=[
["Propane Tanks",5,"tanks","Please label the tank with your name. Tanks can be picked up Sunday afternoon."],
["6-Foot Folding Tables",10,"tables","Please label the table with your name. Tables can be picked up Sunday afternoon."]
];
var roles={
"Concessions":{"icon":"🥤","desc":"Get our delicious treats into the hands of hungry spectators! Ensure coffee and hot water for cocoa are always ready.","sat":[["8:00–10:00 AM",3,"2 volunteers should arrive at 7:30 AM to help with opening setup."],["10:00 AM–12:00 PM",2,""],["12:00–2:00 PM",2,""],["2:00–4:00 PM",2,""],["4:00–5:00 PM",3,"Closing concessions: sell remaining prepared food and help with breakdown."]],"sun":[["8:00–10:00 AM",3,"Includes opening/setup."],["10:00 AM–12:00 PM",2,""],["12:00–2:00 PM",2,""],["1:00–2:00 PM",3,"Closing concessions: sell remaining prepared food and handle breakdown."]]},
"Grill":{"icon":"🔥","desc":"Grill up our breakfast sandwiches and hot dogs during the day! Help out with concession sales during slower cooking times.","sat":[["8:00–10:00 AM",1,""],["10:00 AM–12:00 PM",1,""],["12:00–2:00 PM",1,""],["2:00–4:00 PM",1,""]],"sun":[["8:00–10:00 AM",1,""],["10:00 AM–12:00 PM",1,""],["12:00–2:00 PM",1,"Final grill shift; avoid cooking excess near closing."]]},
"Facilities":{"icon":"🧹","desc":"Check for overflowing trash cans, ensure toilets are stocked, and alert us about any parking violations. Assist with concessions once rounds are completed.","sat":[["9:00–11:00 AM",1,""],["11:00 AM–1:00 PM",1,""],["1:00–3:00 PM",1,""],["3:00–5:00 PM",1,""]],"sun":[["9:00–11:00 AM",1,""],["11:00 AM–1:00 PM",1,""]]}
};
var balls={"sat":[["8:30–9:50 AM",2,"8:30 & 9:10 games"],["9:50–11:10 AM",2,"9:50 & 10:30 games"],["11:10 AM–12:30 PM",2,"11:10 & 11:50 games"],["12:30–1:50 PM",2,"12:30 & 1:10 games"],["1:50–3:10 PM",2,"1:50 & 2:30 games"],["3:10–4:30 PM",2,"3:10 & 3:50 games"],["4:30–5:10 PM",2,"4:30 game only"]],"sun":[["9:00–10:20 AM",2,"9:00 & 9:40 games"],["10:30–11:50 AM",2,"10:30 & 11:10 championship games"]]};
var state={"signups":[]};
try{var raw=window.localStorage.getItem("wms-simple-v1");if(raw){var p=JSON.parse(raw);if(p&&p.signups&&p.signups.length>=0){state=p;}}}catch(ignore){}
function save(){try{window.localStorage.setItem("wms-simple-v1",JSON.stringify(state));}catch(ignore){}}
function count(id){var n=0,i;for(i=0;i<state.signups.length;i++){if(state.signups[i].id===id){n+=state.signups[i].qty||1;}}return n;}
function left(id,total){return Math.max(0,total-count(id));}
function frame(body){A.innerHTML='<main class="shell">'+body+'<div class="footer">Westmoreland Bulldogs • October 24–25, 2026</div></main>';}
function nav(icon,title,sub,where){return '<button class="card nav" data-go="'+esc(where)+'"><span class="icon">'+icon+'</span><span class="grow"><span class="title">'+esc(title)+'</span><span class="sub">'+esc(sub)+'</span></span><b>›</b></button>';}
function top(title,back){return '<button class="back" data-go="'+esc(back||"home")+'">‹ Back</button><div class="heading">'+title+'</div>';}
function home(){frame('<div class="hero"><div class="eyebrow">WESTMORELAND BULLDOGS</div><h1>47th Annual Westmoreland Middle School Soccer Tournament</h1><p>October 24–25, 2026</p></div><div class="card money"><div class="title">💵 Monetary Donations</div><div class="sub">Send cash or check to school in a sealed envelope marked “Soccer Tournament Donation”. Checks can be made out to Westmoreland PTA.</div></div>'+nav("🍎","Food Donations","Help stock the tournament concession stand","food")+nav("⚽","Equipment","Propane tanks and folding tables","equipment")+nav("🙋","Concessions Volunteers","Setup • Concessions • Grill • Facilities","vol")+nav("⚽","Ball Kids","Two fields • two consecutive games per shift","ball")+nav("📋","My Sign-Ups","View or cancel commitments made on this device","mine"));}
function donations(kind,data){var out=top(kind==="food"?"🍎 Food Donations":"⚽ Equipment","home"),i,x,id,r,pct;for(i=0;i<data.length;i++){x=data[i];id=kind+"-"+i;r=left(id,x[1]);pct=Math.min(100,(count(id)/x[1])*100);out+='<div class="card"><div class="title">'+esc(x[0])+'</div><div class="sub"><b>'+r+' '+esc(x[2])+' remaining</b> of '+x[1]+'</div><div class="progress"><span style="width:'+pct+'%"></span></div>'+(x[3]?'<div class="note">'+esc(x[3])+'</div>':'')+'<div class="actions"><button class="btn signup" data-id="'+id+'" data-label="'+esc(x[0])+'" data-total="'+x[1]+'" data-unit="'+esc(x[2])+'" data-type="'+kind+'" '+(r<1?"disabled":"")+'>Sign Up</button></div></div>';}frame(out);}
function shiftCard(id,label,total,note){var r=left(id,total);return '<div class="card"><div class="title">'+esc(label)+'</div><div class="sub">'+r+' of '+total+' spots remaining</div>'+(note?'<div class="note">'+esc(note)+'</div>':'')+'<div class="actions"><button class="btn signup" data-id="'+id+'" data-label="'+esc(label)+'" data-total="'+total+'" data-unit="spot" data-type="shift" '+(r<1?"disabled":"")+'>Sign Up</button></div></div>';}
function volunteers(){var out=top("🙋 Concessions Volunteers","home")+'<div class="sub">Choose the job you’d like to help with, then select a shift.</div><div class="day">Friday, October 23 • 4:00–6:00 PM</div>'+shiftCard("friday-parking","🚗 Parking & Signage Setup — 4:00–6:00 PM",3,"")+shiftCard("friday-concession","🥤 Concession Stand Setup — 4:00–6:00 PM",3,"")+'<div class="day">Weekend Volunteer Roles</div>';var k;for(k in roles){if(roles.hasOwnProperty(k)){out+=nav(roles[k].icon,k,"Tap to see responsibilities and available shifts","role:"+k);}}frame(out);}
function rolePage(k){var r=roles[k],out=top(r.icon+" "+esc(k),"vol")+'<div class="note">'+esc(r.desc)+'</div>';out+=roleDay(k,"Saturday, October 24",r.sat,"sat");out+=roleDay(k,"Sunday, October 25",r.sun,"sun");frame(out);}
function roleDay(k,day,arr,d){var out='<div class="day">'+esc(day)+'</div><div class="card">',i,x,id,r;for(i=0;i<arr.length;i++){x=arr[i];id="role-"+k+"-"+d+"-"+i;r=left(id,x[1]);out+='<div class="shift"><div class="grow"><b>'+esc(x[0])+'</b><div class="sub">'+r+' of '+x[1]+' spots remaining'+(x[2]?' • '+esc(x[2]):'')+'</div></div><button class="btn signup" data-id="'+esc(id)+'" data-label="'+esc(k+" — "+day+" — "+x[0])+'" data-total="'+x[1]+'" data-unit="spot" data-type="shift" '+(r<1?"disabled":"")+'>Sign Up</button></div>';}return out+'</div>';}
function ballPage(){var out=top("⚽ Ball Kids","home")+'<div class="note">Each shift covers two consecutive games. Two Ball Kids are needed per shift—one for each field. Field assignments can be made when volunteers arrive.</div>'+ballDay("Saturday, October 24",balls.sat,"sat")+ballDay("Sunday, October 25",balls.sun,"sun");frame(out);}
function ballDay(day,arr,d){var out='<div class="day">'+esc(day)+'</div><div class="card">',i,x,id,r;for(i=0;i<arr.length;i++){x=arr[i];id="ball-"+d+"-"+i;r=left(id,2);out+='<div class="shift"><div class="grow"><b>'+esc(x[0])+'</b><div class="sub">'+esc(x[2])+' • '+r+' of 2 spots remaining</div></div><button class="btn signup" data-id="'+id+'" data-label="'+esc("Ball Kids — "+day+" — "+x[0])+'" data-total="2" data-unit="spot" data-type="shift" '+(r<1?"disabled":"")+'>Sign Up</button></div>';}return out+'</div>';}
function form(btn){var id=btn.getAttribute("data-id"),label=btn.getAttribute("data-label"),total=parseInt(btn.getAttribute("data-total"),10),unit=btn.getAttribute("data-unit"),type=btn.getAttribute("data-type"),max=(type==="food"||type==="equipment")?left(id,total):1,out=top("Sign Up",type==="food"?"food":type==="equipment"?"equipment":"home")+'<div class="card"><div class="title">'+esc(label)+'</div><form id="signupForm" data-id="'+esc(id)+'" data-label="'+esc(label)+'" data-unit="'+esc(unit)+'">';if(max>1){out+='<label>Quantity</label><select name="qty">';var i;for(i=1;i<=max;i++){out+='<option value="'+i+'">'+i+'</option>';}out+='</select>';}out+='<label>Name</label><input name="name" required><label>Email or phone</label><input name="contact" required><div class="sub">Used privately to identify your signup.</div><button class="btn" type="submit" style="width:100%;margin-top:16px">Confirm Sign-Up</button></form></div>';frame(out);}
function mine(){var out=top("📋 My Sign-Ups","home")+'<div class="sub">This version remembers sign-ups made on this device.</div>',i,x;if(!state.signups.length){out+='<div class="card"><div class="sub">No sign-ups have been made on this device yet.</div></div>';}else{for(i=0;i<state.signups.length;i++){x=state.signups[i];out+='<div class="card"><div class="title">'+esc(x.label)+'</div><div class="sub">'+(x.qty>1?x.qty+" "+esc(x.unit)+" • ":"")+esc(x.name)+'</div><div class="actions"><button class="btn danger cancel" data-key="'+x.key+'">Cancel</button></div></div>';}}frame(out);}
function go(v){if(v==="home"){home();}else if(v==="food"){donations("food",food);}else if(v==="equipment"){donations("equipment",equipment);}else if(v==="vol"){volunteers();}else if(v==="ball"){ballPage();}else if(v==="mine"){mine();}else if(v.indexOf("role:")===0){rolePage(v.substring(5));}window.scrollTo(0,0);}
document.addEventListener("click",function(e){var t=e.target;while(t&&t!==document){if(t.getAttribute&&t.getAttribute("data-go")){go(t.getAttribute("data-go"));return;}if(t.className&&String(t.className).indexOf("signup")>=0){form(t);return;}if(t.className&&String(t.className).indexOf("cancel")>=0){var key=t.getAttribute("data-key");if(window.confirm("Cancel this sign-up?")){var n=[],i;for(i=0;i<state.signups.length;i++){if(String(state.signups[i].key)!==String(key)){n.push(state.signups[i]);}}state.signups=n;save();mine();}return;}t=t.parentNode;}});
document.addEventListener("submit",function(e){if(e.target&&e.target.id==="signupForm"){e.preventDefault();var f=e.target,qty=f.elements.qty?parseInt(f.elements.qty.value,10):1;state.signups.push({"id":f.getAttribute("data-id"),"label":f.getAttribute("data-label"),"unit":f.getAttribute("data-unit"),"qty":qty,"name":f.elements.name.value,"contact":f.elements.contact.value,"key":new Date().getTime()});save();mine();}});
home();
}catch(e){fail(e);}
}());
</script>
</body>
</html>
