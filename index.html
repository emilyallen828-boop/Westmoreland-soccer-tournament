function form(btn){var id=btn.getAttribute("data-id"),label=btn.getAttribute("data-label"),total=parseInt(btn.getAttribute("data-total"),10),unit=btn.getAttribute("data-unit"),type=btn.getAttribute("data-type"),max=(type==="food"||type==="equipment")?left(id,total):1,out=top("Sign Up",type==="food"?"food":type==="equipment"?"equipment":"home")+'<div class="card"><div class="title">'+esc(label)+'</div><form id="signupForm" data-id="'+esc(id)+'" data-label="'+esc(label)+'" data-unit="'+esc(unit)+'">';if(max>1){out+='<label>Quantity</label><select name="qty">';var i;for(i=1;i<=max;i++){out+='<option value="'+i+'">'+i+'</option>';}out+='</select>';}out+='<label>Name</label><input name="name" required><label>Email or phone</label><input name="contact" required><div class="sub">Used privately to identify your signup.</div><button class="btn" type="submit" style="width:100%;margin-top:16px">Confirm Sign-Up</button></form></div>';frame(out);}
function mine(){frame(top("📋 My Sign-Ups","home")+'<div class="card"><div class="sub">Loading your sign-ups…</div></div>');loadMine().then(function(items){var out=top("📋 My Sign-Ups","home")+'<div class="sub">Your private commitments from this device.</div>',i,x,detail;if(!items.length){out+='<div class="card"><div class="sub">No active sign-ups have been made on this device yet.</div></div>';}else{for(i=0;i<items.length;i++){x=items[i];detail=(x.day_label?x.day_label+" • ":"")+(x.time_label||"");out+='<div class="card"><div class="title">'+esc(x.label)+'</div>'+(detail?'<div class="sub">'+esc(detail)+'</div>':'')+'<div class="sub"><b>'+x.quantity+' '+esc(x.unit)+'</b> • '+esc(x.name)+'</div><div class="actions"><button class="btn editmine" data-mid="'+esc(x.id)+'" data-qty="'+x.quantity+'" data-name="'+esc(x.name)+'" data-contact="'+esc(x.contact)+'" data-label="'+esc(x.label)+'" data-unit="'+esc(x.unit)+'">Edit</button> <button class="btn danger cancelmine" data-mid="'+esc(x.id)+'" data-label="'+esc(x.label)+'">Cancel</button></div></div>';}}frame(out);}).catch(function(err){frame(top("📋 My Sign-Ups","home")+'<div class="card"><div class="title">Could not load sign-ups</div><div class="sub">'+esc(err.message)+'</div></div>');});}
function editMineForm(btn){var id=btn.getAttribute("data-mid"),qty=parseInt(btn.getAttribute("data-qty"),10)||1,name=btn.getAttribute("data-name")||"",contact=btn.getAttribute("data-contact")||"",label=btn.getAttribute("data-label")||"",unit=btn.getAttribute("data-unit")||"spot";var out=top("Edit Sign-Up","mine")+'<div class="card"><div class="title">'+esc(label)+'</div><form id="editMineForm" data-mid="'+esc(id)+'">';if(unit!=="spot"){out+='<label>Quantity</label><input type="number" name="qty" min="1" value="'+qty+'" required>';}else{out+='<input type="hidden" name="qty" value="1">';}out+='<label>Name</label><input name="name" value="'+esc(name)+'" required><label>Email or phone</label><input name="contact" value="'+esc(contact)+'" required><button class="btn" type="submit" style="width:100%;margin-top:16px">Save Changes</button></form></div>';frame(out);}

function go(v){if(v==="home"){home();}else if(v==="food"){donations("food",food);}else if(v==="equipment"){donations("equipment",equipment);}else if(v==="vol"){volunteers();}else if(v==="ball"){ballPage();}else if(v==="mine"){mine();}else if(v==="organizer"){organizer();}else if(v.indexOf("role:")===0){rolePage(v.substring(5));}window.scrollTo(0,0);}
document.addEventListener("click",function(e){var t=e.target;while(t&&t!==document){if(t.getAttribute&&t.getAttribute("data-go")){go(t.getAttribute("data-go"));return;}if(t.className&&String(t.className).indexOf("editmine")>=0){editMineForm(t);return;}if(t.className&&String(t.className).indexOf("cancelmine")>=0){var cid=t.getAttribute("data-mid"),clabel=t.getAttribute("data-label");if(window.confirm("Cancel your sign-up for "+clabel+"?")){t.disabled=true;t.textContent="Cancelling…";cancelMine(cid).then(function(){return loadRemote();}).then(function(){mine();}).catch(function(err){window.alert(err.message);mine();});}return;}if(t.id==="adminLogout"){authStore(null);organizerLoginPage("Signed out.");return;}if(t.className&&String(t.className).indexOf("signup")>=0){form(t);return;}t=t.parentNode;}});
document.addEventListener("submit",function(e){if(e.target&&e.target.id==="adminLogin"){e.preventDefault();var af=e.target,ab=af.querySelector("button[type=submit]");ab.disabled=true;ab.textContent="Signing in…";organizerLogin(af.elements.email.value,af.elements.password.value).then(function(){organizer();}).catch(function(err){organizerLoginPage(err.message);});return;}if(e.target&&e.target.id==="adminSetup"){e.preventDefault();var sf=e.target,sb=sf.querySelector("button[type=submit]");sb.disabled=true;sb.textContent="Creating…";organizerSignup(sf.elements.password.value).then(function(){organizerLoginPage("Check the PTA Gmail inbox for the Supabase confirmation email. After confirming, return here and sign in with the password you just chose.");}).catch(function(err){organizerLoginPage(err.message);});return;}if(e.target&&e.target.id==="signupForm"){e.preventDefault();var f=e.target,qty=f.elements.qty?parseInt(f.elements.qty.value,10):1,name=f.elements.name.value,contact=f.elements.contact.value,button=f.querySelector("button[type=submit]");button.disabled=true;button.textContent="Saving…";submitRemoteSignup(f.getAttribute("data-id"),qty,name,contact).then(function(){return loadRemote();}).then(function(){mine();}).catch(function(err){button.disabled=false;button.textContent="Confirm Sign-Up";window.alert(err&&err.message?err.message:"That signup could not be saved. Please try again.");});return;}if(e.target&&e.target.id==="editMineForm"){e.preventDefault();var ef=e.target,eq=parseInt(ef.elements.qty.value,10)||1,en=ef.elements.name.value,ec=ef.elements.contact.value,eb=ef.querySelector("button[type=submit]");eb.disabled=true;eb.textContent="Saving…";updateMine(ef.getAttribute("data-mid"),eq,en,ec).then(function(){return loadRemote();}).then(function(){mine();}).catch(function(err){eb.disabled=false;eb.textContent="Save Changes";window.alert(err.message);});}});
home();loadRemote();
}catch(e){fail(e);}
}());
</script>
